<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi pequeño cambio en familia</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f3f7fb;
    color:#26354a;
}

.contenedor{
    max-width:700px;
    margin:30px auto;
    padding:20px;
}

.tarjeta{
    background:white;
    border-radius:25px;
    padding:30px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    color:#31577c;
    margin-bottom:5px;
}

.subtitulo{
    text-align:center;
    color:#657589;
    margin-bottom:25px;
}

.caja{
    border:3px dashed #9bb8d1;
    border-radius:18px;
    padding:25px;
    text-align:center;
}

input[type="file"]{
    width:100%;
    padding:15px;
    font-size:16px;
}

#vista{
    display:none;
    width:100%;
    margin-top:20px;
    border-radius:15px;
}

button{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:none;
    border-radius:15px;
    background:#3978a8;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#285c85;
}

#estado{
    text-align:center;
    margin-top:20px;
    font-weight:bold;
}

.resultado{
    display:none;
    margin-top:30px;
    padding:30px;
    border-radius:25px;
    text-align:center;
    background:#eef8f0;
}

.resultado h2{
    color:#315f4b;
}

.icono{
    font-size:70px;
}

.mensaje{
    font-size:18px;
    line-height:1.6;
}

.accion{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-top:15px;
}

.senal{
    font-weight:bold;
    margin-top:15px;
}

</style>
</head>

<body>

<div class="contenedor">

<div class="tarjeta">

<h1>💙 Mi pequeño cambio en familia</h1>

<p class="subtitulo">
Toma una fotografía de tu formulario y descubre
qué aspecto de tu familia están buscando fortalecer.
</p>

<div class="caja">

<p><strong>📸 Fotografía del formulario</strong></p>

<input
type="file"
id="foto"
accept="image/*"
capture="environment"
>

<img id="vista">

</div>

<button onclick="analizarFormulario()">
✨ DESCUBRIR MI FAMILIA
</button>

<div id="estado"></div>

<div id="resultado" class="resultado">

<div id="icono" class="icono"></div>

<h2 id="titulo"></h2>

<p id="mensaje" class="mensaje"></p>

<div id="accion" class="accion"></div>

<div id="senal" class="senal"></div>

</div>

</div>

</div>


<script>

const archivo = document.getElementById("foto");

archivo.addEventListener("change", function(){

    const imagen = document.getElementById("vista");

    if(this.files.length > 0){

        imagen.src = URL.createObjectURL(this.files[0]);

        imagen.style.display = "block";

    }

});


/* RESULTADOS */

const familias = {

    escucha: {

        icono:"💙",

        titulo:"Familia que escucha",

        mensaje:
        "En nuestra familia estamos fortaleciendo la escucha y el diálogo.",

        accion:
        "🌱 Nuestro pequeño cambio: escuchar antes de responder y expresarnos con calma.",

        senal:
        "✨ Nuestra señal de avance: MÁS DIÁLOGO."

    },

    carino: {

        icono:"❤️",

        titulo:"Familia que acompaña con cariño",

        mensaje:
        "En nuestra familia buscamos compartir más momentos y demostrar nuestro cariño.",

        accion:
        "🌱 Nuestro pequeño cambio: dedicar un momento especial para estar juntos.",

        senal:
        "✨ Nuestra señal de avance: MÁS CERCANÍA."

    },

    paciencia: {

        icono:"🌱",

        titulo:"Familia que practica la paciencia",

        mensaje:
        "En nuestra familia estamos aprendiendo a responder con mayor calma.",

        accion:
        "🌱 Nuestro pequeño cambio: hacer una pausa antes de reaccionar.",

        senal:
        "✨ Nuestra señal de avance: MÁS CALMA."

    },

    acuerdos: {

        icono:"🤝",

        titulo:"Familia que construye acuerdos",

        mensaje:
        "En nuestra familia estamos fortaleciendo los acuerdos, los límites con cariño y la colaboración.",

        accion:
        "🌱 Nuestro pequeño cambio: conversar y tomar decisiones juntos.",

        senal:
        "✨ Nuestra señal de avance: MÁS COLABORACIÓN."

    },

    confianza: {

        icono:"💬",

        titulo:"Familia que fortalece la confianza",

        mensaje:
        "En nuestra familia estamos construyendo un espacio donde todos puedan hablar y sentirse seguros.",

        accion:
        "🌱 Nuestro pequeño cambio: escuchar sin juzgar y conversar con confianza.",

        senal:
        "✨ Nuestra señal de avance: MÁS CONFIANZA."

    }

};


/* ANALIZAR FOTO */

async function analizarFormulario(){

    const archivoSeleccionado =
        document.getElementById("foto").files[0];

    if(!archivoSeleccionado){

        alert("📸 Primero toma una fotografía del formulario.");

        return;

    }

    const estado =
        document.getElementById("estado");

    estado.innerHTML =
        "🔎 Estamos leyendo tu formulario...";

    try{

        const resultadoOCR =
            await Tesseract.recognize(

                archivoSeleccionado,

                "spa",

                {

                    logger: function(info){

                        if(info.status === "recognizing text"){

                            const porcentaje =
                                Math.round(info.progress * 100);

                            estado.innerHTML =
                                "🔎 Analizando formulario: "
                                + porcentaje
                                + "%";

                        }

                    }

                }

            );

        const texto =
            resultadoOCR.data.text.toLowerCase();

        console.log(texto);

        const familia =
            determinarFamilia(texto);

        mostrarResultado(familia);

        estado.innerHTML =
            "✅ ¡Formulario analizado!";


    }catch(error){

        console.error(error);

        estado.innerHTML =
            "❌ No pudimos leer la fotografía. Intenta tomarla nuevamente con buena iluminación.";

    }

}


/* DETERMINAR FAMILIA */

function determinarFamilia(texto){

    let puntos = {

        escucha:0,

        carino:0,

        paciencia:0,

        acuerdos:0,

        confianza:0

    };


    /* ESCUCHA */

    if(
        texto.includes("escuchar") ||
        texto.includes("dialogo") ||
        texto.includes("diálogo")
    ){

        puntos.escucha += 5;

    }


    if(
        texto.includes("más diálogo") ||
        texto.includes("mas dialogo")
    ){

        puntos.escucha += 5;

    }


    /* CARIÑO */

    if(
        texto.includes("compartir tiempo") ||
        texto.includes("cariño") ||
        texto.includes("carino")
    ){

        puntos.carino += 5;

    }


    /* PACIENCIA */

    if(
        texto.includes("paciencia") ||
        texto.includes("calma") ||
        texto.includes("tranquilidad")
    ){

        puntos.paciencia += 5;

    }


    if(
        texto.includes("más calma") ||
        texto.includes("mas calma")
    ){

        puntos.paciencia += 5;

    }


    /* ACUERDOS */

    if(
        texto.includes("acuerdo") ||
        texto.includes("límites") ||
        texto.includes("limites") ||
        texto.includes("colaboración") ||
        texto.includes("colaboracion")
    ){

        puntos.acuerdos += 5;

    }


    /* CONFIANZA */

    if(
        texto.includes("confianza") ||
        texto.includes("seguridad")
    ){

        puntos.confianza += 5;

    }


    /* BUSCAR MAYOR PUNTAJE */

    let familiaGanadora =
        "escucha";

    let mayor =
        puntos.escucha;


    for(const familia in puntos){

        if(puntos[familia] > mayor){

            mayor =
                puntos[familia];

            familiaGanadora =
                familia;

        }

    }


    return familiaGanadora;

}


/* MOSTRAR RESULTADO */

function mostrarResultado(familia){

    const datos =
        familias[familia];

    document.getElementById("icono").innerHTML =
        datos.icono;

    document.getElementById("titulo").innerHTML =
        datos.titulo;

    document.getElementById("mensaje").innerHTML =
        datos.mensaje;

    document.getElementById("accion").innerHTML =
        datos.accion;

    document.getElementById("senal").innerHTML =
        datos.senal;

    document.getElementById("resultado").style.display =
        "block";

    window.scrollTo({

        top:
        document.getElementById("resultado").offsetTop,

        behavior:"smooth"

    });

}

</script>

</body>
</html>
